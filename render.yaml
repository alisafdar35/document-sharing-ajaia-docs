# ---------------------------------------------------------------------------
# Render blueprint for the Ajaia Docs API + PostgreSQL database.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repository.
# After the first deploy, set CLIENT_URL to your Vercel domain so CORS allows
# the frontend through.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: ajaia-docs-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace server
    # start:prod applies the Prisma schema and seeds the demo users (both are
    # idempotent) before the API starts listening.
    startCommand: npm run start:prod --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render sets NODE_ENV=production, which makes npm skip devDependencies.
      # tsc, the @types packages, the Prisma CLI and tsx are all needed by the
      # build or by start:prod, so they are declared as real dependencies in
      # server/package.json. This is belt-and-braces for anything added later.
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      # Set to the deployed frontend origin, e.g. https://ajaia-docs.vercel.app
      # Comma-separate to allow more than one origin.
      - key: CLIENT_URL
        sync: false

databases:
  - name: ajaia-docs-db
    plan: free
    databaseName: ajaia_docs
    user: ajaia
